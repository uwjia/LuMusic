[package]
name = "lumusic"
version = "0.1.2"
description = "LuMusic - a local music player built with Tauri + React"
edition = "2021"

[lib]
name = "lumusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
rodio = "0.20"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
] }
rand = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
hound = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
